name: Verify precompiled Plesk release
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No dependencies, database, secrets, or compilation required.
      - name: Verify release integrity and matching sources
        run: node plesk/verify.cjs --sources
